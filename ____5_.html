  // Lock file chooser and layer controls during export so nothing corrupts the session.
  // chooseBtn is a <label> so toggle a CSS class rather than .disabled
  document.getElementById('chooseBtn').classList.toggle('disabled', on);
  document.getElementById('fileInput').disabled = on;
  document.getElementById('addLayerBtn').disabled = on;
  document.getElementById('repetitionsInput').disabled = on;
  document.getElementById('lastRepOnlyChk').disabled   = on;
  document.getElementById('durationInput').disabled = on;
  document.getElementById('fpsInput').disabled = on;
  document.getElementById('addPitchLayerBtn').disabled = on;
  document.querySelectorAll('.pitch-layer-del, #audio-pitch-list input').forEach(b => b.disabled = on);
  document.getElementById('saveChainBtn').disabled = on;
  document.getElementById('chainFileInput').disabled = on;
  document.getElementById('loadChainBtn').classList.toggle('disabled', on);
  // Grey out all layer delete and effect-type buttons
  document.querySelectorAll('.layer-del, .effect-type-btn').forEach(b => b.disabled = on);
}

function resetExportState() {
  isExporting = false; exportCancelled = false;
  currentRepMultiplier = 1;  // restore preview to single-pass
  stopPitchSources();
  stopManualCapture();
  if (captureStream) { captureStream.getVideoTracks().forEach(t => t.stop()); captureStream = null; }
  mediaRecorder = null; recordedChunks = [];
  setExportingUI(false);
  document.getElementById('progress-fill').style.width = '0%';
}

// ── Frame-accurate manual capture ────────────────────────
// canvas.captureStream(fps) is wall-clock driven: it samples the canvas at a
// fixed real-time interval, which can drop frames (if rendering/GC stalls the
// main thread past that interval) or duplicate frames (if the source video's
// frame arrives slower than the sample rate). To guarantee every decoded
// video frame is captured exactly once, we instead put the track in manual
// mode (captureStream(0)) and, on every actual new video frame (via
// requestVideoFrameCallback), render it and push exactly that frame with
// track.requestFrame(). Falls back to the old wall-clock mode when the
// browser lacks requestVideoFrameCallback or manual track.requestFrame().
let manualDriveActive = false;

function driveManualCapture(mySession, videoTrack) {
  manualDriveActive = true;
  const step = () => {
    if (!manualDriveActive || exportSessionId !== mySession) return;
    // Render the current video frame through the WebGL effects stack.
    renderFrame();
    // Only push frames to the capture track while the video is actually
    // playing. Browsers fire requestVideoFrameCallback once on a paused
    // video (to present the current frame), which would bake a frozen
    // frame into the recording before playback even starts. Skipping the
    // push when paused also covers the seek-back gap between repetitions.
    if (!video.paused) {
      // Flush all queued GPU draw commands so the canvas bitmap is complete
      // before we push it to the capture stream. Without this, requestFrame()
      // can snapshot the canvas mid-render and produce a torn/blank frame.
      try { gl.flush(); } catch (_) {}
      // Push this exact rendered frame to the MediaRecorder track — one push
      // per decoded video frame, so output FPS matches the source exactly.
      try { videoTrack.requestFrame(); } catch (_) {}
    }
    if (manualDriveActive) video.requestVideoFrameCallback(step);
  };
  video.requestVideoFrameCallback(step);
}

function stopManualCapture() {
  manualDriveActive = false;
}

function cancelExport() {
  if (!isExporting) return;
  exportCancelled = true;
  video.pause();
  document.getElementById('playBtn').textContent = 'Play';
  const cancelledSession = exportSessionId;
  if (mediaRecorder && (mediaRecorder.state === 'recording' || mediaRecorder.state === 'paused')) {
    // Normal export: stop the recorder; onstop → finishExport handles cleanup.
    // Safety fallback: if onstop never fires (browser edge case), force-finish after 3 s.
    mediaRecorder.stop();
    setTimeout(() => { if (isExporting && exportSessionId === cancelledSession) finishExport(cancelledSession); }, 3000);
  } else if (mediaRecorder) {
    // Recorder exists but was never started — just finish.
    finishExport(cancelledSession);
  }
  // Pro Export has no mediaRecorder — its seek loop detects exportCancelled
  // and calls resetExportState() itself. Nothing extra needed here.
}

function seekTo(time, sessionId) {
  return new Promise((resolve, reject) => {
    if (exportSessionId !== sessionId) { reject(new Error('stale')); return; }
    if (Math.abs(video.currentTime - time) < 0.0001) { resolve(); return; }
    const fn = () => {
      video.removeEventListener('seeked', fn);
      exportSessionId !== sessionId ? reject(new Error('stale')) : resolve();
    };
    video.addEventListener('seeked', fn);
    video.currentTime = time;
  });
}

function getExportFps() {
  const v = parseInt(document.getElementById('fpsInput').value, 10);
  return (!isNaN(v) && v >= 1) ? v : 30;
}

function getTrimDuration() {
  const v = parseFloat(document.getElementById('durationInput').value);
  if (isNaN(v) || v <= 0) return null;  // null = full video
  // Snap to an exact frame boundary at the configured fps so the trim lands
  // on the same frame the "= N frames @ Xfps" hint shows, instead of an
  // arbitrary sub-frame time that timeupdate polling would round differently.
  const fps = getExportFps();
  return Math.round(v * fps) / fps;
}

// Wait for the video to reach its natural end OR the trim point, whichever comes first.
// Returns true on completion, false if cancelled/stale.
function waitForEndOrTrim(sessionId, trimSecs) {
  return new Promise(resolve => {
    const useTrim = trimSecs !== null && trimSecs < video.duration;

    function cleanup() {
      video.removeEventListener('ended', onEnd);
      video.removeEventListener('timeupdate', onTime);
      clearInterval(poll);
    }

    const onEnd = () => { cleanup(); resolve(true); };

    const onTime = () => {
      if (video.currentTime >= trimSecs) {
        video.pause();
        cleanup();
        resolve(true);
      }
    };

    video.addEventListener('ended', onEnd);
    if (useTrim) video.addEventListener('timeupdate', onTime);

    const poll = setInterval(() => {
      if (exportSessionId !== sessionId || exportCancelled || !isExporting) {
        cleanup();
        resolve(false);
      }
    }, 100);
  });
}

async function startExport() {
  if (!videoLoaded || isExporting) return;

  const repetitions = getRepetitions();

  isExporting = true; exportCancelled = false; recordedChunks = [];
  const mySession = ++exportSessionId;

  closeOutputStrip();
  setExportingUI(true);
  setStatus('Seeking to start…');
  document.getElementById('progress-fill').style.width = '0%';

  video.pause();
  document.getElementById('playBtn').textContent = 'Play';

  try { await seekTo(0, mySession); }
  catch (_) { resetExportState(); setStatus('Export cancelled.'); return; }

  if (exportCancelled || exportSessionId !== mySession) {
    resetExportState(); setStatus('Export cancelled.'); return;
  }

  ensureAudioTap();
  if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume().catch(() => {});

  const exportFps = getExportFps();
  const supportsManual = typeof video.requestVideoFrameCallback === 'function';
  let manualCapture = false;
  try {
    captureStream = canvas.captureStream(supportsManual ? 0 : exportFps);
    if (supportsManual) {
      const vt = captureStream.getVideoTracks()[0];
      manualCapture = !!(vt && typeof vt.requestFrame === 'function');
      if (!manualCapture) captureStream = canvas.captureStream(exportFps); // no requestFrame() — fall back to wall-clock sampling
    }
  }
  catch (e) { resetExportState(); setStatus('Error: captureStream() not supported.'); return; }

  if (audioDest) audioDest.stream.getAudioTracks().forEach(t => captureStream.addTrack(t));

  // Drive capture from real decoded video frames (not wall-clock) so every
  // frame is captured exactly once — no drops, no duplicates.
  if (manualCapture) driveManualCapture(mySession, captureStream.getVideoTracks()[0]);

  // Prefer H.264 avc1.4d002a in MP4, fall back to WebM
  let mime = 'video/mp4;codecs=avc1.4d002a,mp4a.40.2';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/mp4;codecs=avc1.4d002a';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/mp4;codecs=avc1.42E01E,mp4a.40.2';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/mp4;codecs=avc1.42E01E';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/mp4';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm;codecs=vp9,opus';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm;codecs=vp8,opus';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';

  const isMP4 = mime.startsWith('video/mp4');
  lastExportMime = mime;

  try { mediaRecorder = new MediaRecorder(captureStream, { mimeType: mime, videoBitsPerSecond: 25_000_000 }); }
  catch (e) { resetExportState(); setStatus('Error: MediaRecorder setup failed.'); return; }

  mediaRecorder.ondataavailable = e => { if (e.data?.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => finishExport(mySession);
  // Do NOT start() here — starting now would begin capturing the still frame-0
  // canvas immediately, while video.play() below is still pending (async
  // setup, etc.), baking a frozen frame into the very start of the recording.
  // Instead we defer the actual start until the moment playback begins (see
  // the `!recorderStarted` branch in the loop below).
  let recorderStarted = false;

  const fullDuration = video.duration;
  const trimSecs     = getTrimDuration();                          // null = full video
  const segDuration  = (trimSecs !== null && trimSecs < fullDuration) ? trimSecs : fullDuration;

  // ── Repetition loop ──────────────────────────────────
  // Each pass: seek to 0 → play → wait for natural end OR trim point.
  // The MediaRecorder captures the canvas stream continuously across all passes,
  // producing one concatenated file (equivalent to ffmpeg -stream_loop N -t trimSecs).
  // When lastRepOnly=true only the final pass is recorded (effects still applied N times).

  const lastRepOnly = getLastRepOnly();
  const repStart    = lastRepOnly ? repetitions - 1 : 0;

  for (let rep = repStart; rep < repetitions; rep++) {
    if (exportCancelled || exportSessionId !== mySession) break;

    // rep N → apply the full effects stack (N+1) times per frame
    currentRepMultiplier = rep + 1;

    // Seek back to start for each repetition (already at 0 on first pass)
    if (rep > 0) {
      setStatus(`Repetition ${rep + 1} / ${repetitions} — seeking…`);
      // The video is paused (frozen on the trim frame) while we seek back to 0.
      // MediaRecorder captures the canvas continuously, so without pausing it
      // here that frozen frame gets baked into the output as a visible freeze
      // at every trim boundary. Pause the recorder for the duration of the
      // seek so no frozen frames are captured.
      if (mediaRecorder && mediaRecorder.state === 'recording' && typeof mediaRecorder.pause === 'function') {
        try { mediaRecorder.pause(); } catch (_) {}
      }
      try { await seekTo(0, mySession); }
      catch (_) { break; }
    }

    if (exportCancelled || exportSessionId !== mySession) break;

    const trimLabel = trimSecs !== null ? ` trim:${trimSecs}s` : '';
    setStatus(`Exporting… rep ${rep + 1}/${repetitions} — effects ×${rep + 1}${trimLabel} (cancel anytime)`);

    // Audio pitch layers play from the start of every repetition.
    if (isPitchActive()) startPitchSources(0);

    // Begin actual capture right as playback starts (first rep), or resume it
    // if it was paused during a seek-back gap (later reps) — either way, no
    // frozen frame gets captured before/between playback.
    if (!recorderStarted) {
      mediaRecorder.start(100);
      recorderStarted = true;
    } else if (mediaRecorder.state === 'paused' && typeof mediaRecorder.resume === 'function') {
      try { mediaRecorder.resume(); } catch (_) {}
    }

    video.play().catch(e => {
      console.warn('play() blocked during export:', e);
      cancelExport();
    });

    // Progress interval for this repetition
    const iv = setInterval(() => {
      if (!isExporting || exportSessionId !== mySession) { clearInterval(iv); return; }
      const frac    = segDuration > 0 ? Math.min(video.currentTime, segDuration) / segDuration : 0;
      const overall = Math.min(100, Math.round(((rep - repStart + frac) / (repetitions - repStart)) * 100));
      document.getElementById('progress-fill').style.width = overall + '%';
      setStatus(`Exporting… rep ${rep + 1}/${repetitions} — ${overall}% total${trimLabel} (cancel anytime)`);
    }, 200);

    const completed = await waitForEndOrTrim(mySession, trimSecs);
    clearInterval(iv);
    if (isPitchActive()) stopPitchSources();

    if (!completed) break;   // cancelled or stale
  }

  document.getElementById('playBtn').textContent = 'Play';

  if (exportSessionId === mySession && !exportCancelled) {
    document.getElementById('progress-fill').style.width = '100%';
    // state can be 'paused' here if the last rep boundary left the recorder
    // paused (see the pause/resume dance above) — stop() is valid from either state.
    if (mediaRecorder && (mediaRecorder.state === 'recording' || mediaRecorder.state === 'paused')) {
      mediaRecorder.stop();
      const finalSession = mySession;
      setTimeout(() => { if (isExporting && exportSessionId === finalSession) finishExport(finalSession); }, 3000);
    }
  }
}

function finishExport(sessionId) {
  if (sessionId !== undefined && exportSessionId !== sessionId) return;
  const wasCancelled = exportCancelled;
  const chunks = recordedChunks.slice();
  resetExportState();

  if (chunks.length === 0) { setStatus('Export stopped — nothing recorded.'); return; }

  const blob = new Blob(chunks, { type: lastExportMime });
  if (lastOutputBlobUrl) { URL.revokeObjectURL(lastOutputBlobUrl); lastOutputBlobUrl = null; }
  lastOutputBlobUrl = URL.createObjectURL(blob);

  const ov = document.getElementById('outputVideo');
  ov.src = lastOutputBlobUrl; ov.load();
  document.getElementById('output-strip').classList.add('visible');

  if (wasCancelled) {
    downloadOutput();
    setStatus('Export cancelled — partial video downloaded & shown below.');
  } else {
    const reps = getRepetitions();
    const lastOnly = getLastRepOnly();
    const expLabel = lastOnly
      ? `rep ${reps} only (effects ×${reps})`
      : `${reps} repetition${reps !== 1 ? 's' : ''} concatenated`;
    setStatus(`Export complete (${expLabel}) — output shown below.`);
  }
}

// ── Pro Export ──────────────────────────────────────────────────────────────
// Frame-accurate offline export via WebCodecs.  The video is paused and
// seeked to every frame position (t = fi/fps) so the encoder receives an
// exact canvas snapshot for each frame — no drops, no duplicates, no
// wall-clock dependency.  Frames from all repetitions are timestamped
// sequentially so the output is one seamlessly concatenated WebM file.
async function startProExport() {
  if (!videoLoaded || isExporting) return;

  if (typeof VideoEncoder === 'undefined') {
    setStatus('Process requires Chrome 94+ / Edge 94+ (WebCodecs API).');
    return;
  }

  const repetitions  = getRepetitions();
  const lastRepOnly  = getLastRepOnly();
  const repStart     = lastRepOnly ? repetitions - 1 : 0;
  const exportedReps = repetitions - repStart;   // 1 when lastRepOnly, else repetitions
  isExporting = true; exportCancelled = false;
  const mySession = ++exportSessionId;

  closeOutputStrip();
  setExportingUI(true);
  document.getElementById('progress-fill').style.width = '0%';
  setStatus('Process: loading muxer…');

  // Dynamically load webm-muxer (pinned to v3 for stable ArrayBufferTarget API).
  if (typeof WebMMuxer === 'undefined') {
    try {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/webm-muxer@3/build/webm-muxer.js';
        s.onload = res;
        s.onerror = () => rej(new Error('Could not load webm-muxer from CDN — check network connection.'));
        document.head.appendChild(s);
      });
    } catch (e) { resetExportState(); setStatus('Pro Export: ' + e.message); return; }
  }
  if (exportCancelled || exportSessionId !== mySession) { resetExportState(); setStatus('Pro Export cancelled.'); return; }

  video.pause();
  document.getElementById('playBtn').textContent = 'Play';
  setStatus('Pro Export: seeking to start…');
  try { await seekTo(0, mySession); }
  catch (_) { resetExportState(); setStatus('Pro Export cancelled.'); return; }
  if (exportCancelled || exportSessionId !== mySession) { resetExportState(); setStatus('Pro Export cancelled.'); return; }

  const fps         = getExportFps();
  const trimSecs    = getTrimDuration();
  const segDuration = (trimSecs !== null && trimSecs < video.duration) ? trimSecs : video.duration;
  const totalFrames = Math.max(1, Math.round(segDuration * fps));
  const totalAll    = totalFrames * exportedReps;
  const frameDurUs  = Math.round(1_000_000 / fps);   // microseconds per frame
  const W = canvas.width, H = canvas.height;

  // ── Verify VP9 encode support ──
  const vCfg = { codec: 'vp09.00.10.08', width: W, height: H, bitrate: 20_000_000, framerate: fps };
  let vpSupport;
  try { vpSupport = await VideoEncoder.isConfigSupported(vCfg); }
  catch (_) { vpSupport = { supported: false }; }
  if (!vpSupport.supported) {
    resetExportState();
    setStatus('Pro Export: VP9 encoding not supported in this browser — try Chrome.');
    return;
  }

  // ── Muxer setup ──
  const { Muxer, ArrayBufferTarget } = WebMMuxer;
  const muxTarget = new ArrayBufferTarget();
  const hasAudio  = !!(audioBuffer && typeof AudioEncoder !== 'undefined');
  const muxer = new Muxer({
    target: muxTarget,
    video: { codec: 'V_VP9', width: W, height: H, frameRate: fps },
    ...(hasAudio ? { audio: { codec: 'A_OPUS', sampleRate: audioBuffer.sampleRate, numberOfChannels: audioBuffer.numberOfChannels } } : {}),
    firstTimestampBehavior: 'offset'
  });

  // ── Video encoder ──
  let encodeError = null;
  const vEnc = new VideoEncoder({
    output: (chunk, meta) => { try { muxer.addVideoChunk(chunk, meta); } catch (e) { encodeError = encodeError || e; } },
    error:  e  => { encodeError = encodeError || e; }
  });
  vEnc.configure(vCfg);

  // ── Audio encoder — encode all reps up-front so audio is ready to mux ──
  // Audio is rendered per repetition (original sound, or the pitch layers mixed together).
  if (hasAudio) {
    const sr            = audioBuffer.sampleRate;
    const ch            = audioBuffer.numberOfChannels;
    const samplesPerRep = Math.round(segDuration * sr);
    const totalSamples  = samplesPerRep * exportedReps;

    // Allocate output PCM (one Float32Array per channel, exported reps only).
    const chanData = Array.from({ length: ch }, () => new Float32Array(totalSamples));

    for (let rep = repStart; rep < repetitions; rep++) {
      if (exportCancelled || exportSessionId !== mySession) break;
      const repOffset = (rep - repStart) * samplesPerRep;
      const mult      = rep + 1;

      if (isPitchActive()) {
        // Repetition N runs the pitch stack N times; every voice goes through every layer (5,0 → 10,5,5,0).
        for (const v of getPitchVoices(mult)) {
          const buf = v.buf, vol = v.gain;
          for (let c = 0; c < ch; c++) {
            const src = buf.getChannelData(c), dst = chanData[c];
            const len = Math.min(samplesPerRep, src.length);
            for (let i = 0; i < len; i++) dst[repOffset + i] += src[i] * vol;
          }
        }
      } else {
        // Original audio, unchanged.
        for (let c = 0; c < ch; c++) {
          const src = audioBuffer.getChannelData(c), dst = chanData[c];
          const len = Math.min(samplesPerRep, src.length);
          for (let i = 0; i < len; i++) dst[repOffset + i] = src[i];
        }
      }
    }

    if (exportCancelled || exportSessionId !== mySession) {
      vEnc.close(); resetExportState(); setStatus('Pro Export cancelled.'); return;
    }

    setStatus('Pro Export: encoding audio…');
    const CHUNK = 4096;
    const aEnc = new AudioEncoder({
      output: (chunk, meta) => { try { muxer.addAudioChunk(chunk, meta); } catch (_) {} },
      error:  e  => console.error('AudioEncoder:', e)
    });
    aEnc.configure({ codec: 'opus', sampleRate: sr, numberOfChannels: ch, bitrate: 128_000 });

    // Encode in CHUNK-sized AudioData packets (f32-planar: ch0 then ch1 … concatenated).
    for (let off = 0; off < totalSamples; off += CHUNK) {
      const len = Math.min(CHUNK, totalSamples - off);
      const buf = new Float32Array(ch * len);
      for (let c = 0; c < ch; c++) buf.set(chanData[c].subarray(off, off + len), c * len);
      const ad = new AudioData({
        format: 'f32-planar', sampleRate: sr, numberOfChannels: ch,
        numberOfFrames: len, timestamp: Math.round(off * 1_000_000 / sr), data: buf.buffer
      });
      aEnc.encode(ad);
      ad.close();
    }
    await aEnc.flush();
  }

  // ── Video frame-by-frame seek → render → encode ──
  // Each frame: seek to exact time, render through full WebGL effect stack,
  // gpu-flush, snapshot canvas as VideoFrame with a precise µs timestamp.
  let gf = 0;   // global frame index across exported reps (drives output timestamp)
  outer:
  for (let rep = repStart; rep < repetitions; rep++) {
    currentRepMultiplier = rep + 1;
    for (let fi = 0; fi < totalFrames; fi++) {
      if (exportCancelled || exportSessionId !== mySession || encodeError) break outer;

      const t = fi / fps;
      try { await seekTo(t, mySession); }
      catch (_) { break outer; }

      // Render the effects stack for this source frame.
      renderFrame();
      // gl.finish() blocks until the GPU finishes all draw commands, ensuring
      // the canvas bitmap is complete before we snapshot it into a VideoFrame.
      try { gl.finish(); } catch (_) {}

      const tsUs = gf * frameDurUs;
      const vf   = new VideoFrame(canvas, { timestamp: tsUs, duration: frameDurUs });
      // Key-frame every second (or on the first frame of each rep) for seekability.
      vEnc.encode(vf, { keyFrame: fi === 0 || fi % fps === 0 });
      vf.close();
      gf++;

      const pct = Math.round((gf / totalAll) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
      const repLabel = lastRepOnly ? `rep ${repetitions} (last only)` : `rep ${rep + 1}/${repetitions}`;
      setStatus(`Pro Export: ${repLabel} · frame ${fi + 1}/${totalFrames} · ${pct}% (cancel anytime)`);
    }
  }

  if (exportCancelled || exportSessionId !== mySession) {
    vEnc.close();
    resetExportState(); setStatus('Pro Export cancelled.'); return;
  }
  if (encodeError) {
    vEnc.close();
    resetExportState(); setStatus('Pro Export encode error: ' + encodeError.message); return;
  }

  setStatus('Pro Export: finalizing…');
  await vEnc.flush();
  muxer.finalize();

  const blob = new Blob([muxTarget.buffer], { type: 'video/webm' });
  lastExportMime = 'video/webm';
  if (lastOutputBlobUrl) { URL.revokeObjectURL(lastOutputBlobUrl); lastOutputBlobUrl = null; }
  lastOutputBlobUrl = URL.createObjectURL(blob);

  const ov = document.getElementById('outputVideo');
  ov.src = lastOutputBlobUrl; ov.load();
  document.getElementById('output-strip').classList.add('visible');
  document.getElementById('progress-fill').style.width = '100%';

  resetExportState();
  const proLabel = lastRepOnly
    ? `rep ${repetitions} only (effects ×${repetitions})`
    : `${repetitions} rep${repetitions !== 1 ? 's' : ''} concatenated`;
  setStatus(`Pro Export complete — ${gf} frames · ${proLabel} · output shown below.`);
}

function downloadOutput() {
  if (!lastOutputBlobUrl) return;
  const ext = lastExportMime.startsWith('video/mp4') ? 'mp4' : 'mp4';
  const a = document.createElement('a');
  a.href = lastOutputBlobUrl; a.download = `processed_video.${ext}`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function closeOutputStrip() {
  document.getElementById('output-strip').classList.remove('visible');
  const v = document.getElementById('outputVideo');
  v.pause(); v.src = '';
}

function setStatus(msg) { document.getElementById('status-text').textContent = msg; }

// Save this page as a single self-contained .html file.
function downloadHtmlFile() {
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'avs-ihtx-er.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  setStatus('Downloaded avs-ihtx-er.html');
}

// ═══════════════════════════════════════════════════════
//  Theme (light / dark)
// ═══════════════════════════════════════════════════════
function syncThemeBtn() {
  const dark = document.body.classList.contains('dark');
  const b = document.getElementById('themeBtn');
  if (b) b.textContent = dark ? '☀ Light' : '🌙 Dark';
}
function toggleTheme() {
  document.body.classList.toggle('dark');
  try { localStorage.setItem('avs-theme', document.body.classList.contains('dark') ? 'dark' : 'light'); } catch (_) {}
  syncThemeBtn();
}
(function initTheme() {
  try {
    const t = localStorage.getItem('avs-theme');
    if (t === 'dark') document.body.classList.add('dark');
    else if (t === 'light') document.body.classList.remove('dark');
  } catch (_) {}
  syncThemeBtn();
})();

// ═══════════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════════
if (gl) initWebGL();

</script>
